name: Python Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: python -m pip install --upgrade pip pytest flake8 mypy

      - name: Run pytest
        working-directory: cursus/python
        run: pytest

      - name: Run flake8
        working-directory: cursus/python
        run: flake8 .

      - name: Run mypy
        working-directory: cursus/python
        run: mypy --strict .
