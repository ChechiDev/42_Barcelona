[tool.poetry]
name = "matrix_env"
version = "0.1.0"
description = "Matrix data analysis dependency management"
authors = ["sperez-l"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pandas = ">=2.0"
numpy = ">=1.24"
matplotlib = ">=3.7"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
