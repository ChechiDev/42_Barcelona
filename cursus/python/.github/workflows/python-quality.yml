name: Python Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 mypy pytest

      - name: Run pytest
        run: python -m pytest

      - name: Run flake8
        run: python -m flake8 $(git ls-files '*.py')

      - name: Run mypy strict
        run: python -m mypy --strict $(git ls-files '*.py')
